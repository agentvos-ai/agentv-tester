name: telecom
display_name: "Telecommunications"
shims:
  - iot
  - analytics
  - rest_api
  - support_desk
  - notification
  - cicd
  - database
  - vector_db
  - email
  - search
  - workflow
  - filesystem
  - compliance
  - hitl
default_agent: network_fault_agent
agents:
