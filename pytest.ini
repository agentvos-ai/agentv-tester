[pytest]
filterwarnings =
    # Suppress all known noisy upstream warnings for Python 3.14 industrial stack
    ignore:.*_UnionGenericAlias is deprecated.*:DeprecationWarning
    ignore:.*Core Pydantic V1 functionality isn't compatible.*:UserWarning
    ignore:.*allowed_objects.*:
    ignore:.*jsonschema.RefResolver is deprecated.*:DeprecationWarning
    ignore:.*Accessing jsonschema.__version__ is deprecated.*:DeprecationWarning
    ignore:.*google.genai.*:DeprecationWarning
    ignore:.*langchain.*:DeprecationWarning
    ignore:.*langchain.*:UserWarning

addopts =
    --cov=core
    --cov=verticals
    --cov=frameworks
    --cov=shims
    --cov=llm_providers
    --cov-report=term-missing
    --cov-report=html
