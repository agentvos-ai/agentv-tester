[pytest]
filterwarnings =
    # Suppress all known noisy upstream warnings for Python 3.14 industrial stack
    ignore:.*UnionGenericAlias.*
    ignore:.*Core Pydantic V1 functionality.*
    ignore:.*allowed_objects.*
    ignore:.*jsonschema.*
    ignore:.*google.genai.*
    ignore:.*langchain.*
    ignore:.*asyncio.iscoroutinefunction.*
    ignore:.*LangChainPendingDeprecationWarning.*

addopts =
    --cov=core
    --cov=verticals
    --cov=frameworks
    --cov=shims
    --cov=llm_providers
    --cov=server
    --cov-report=term-missing
    --cov-report=html
